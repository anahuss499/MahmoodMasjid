    :root {
      --green-dark: #0F291F;
      --green: #16382C;
      --green-mid: #1F5C46;
      --gold: #B08D3F;
      --gold-light: #F4D98A;
      --cream: #F7F3EA;
      --card: #FFFFFF;
      --ink: #26291F;
      --muted: #6E7263;
      --muted-light: #8A8D7C;
      --faint: #B4B79F;
      --border: #E4DCC7;
      --border-soft: #F0EBDD;
      --danger: #A6483F;
      --danger-bg: #FBF1EF;
      --danger-border: #E7C9C4;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    body.rtl {
      font-family: 'Noto Nastaliq Urdu', 'Segoe UI', Tahoma, sans-serif;
      direction: rtl;
    }

    body.rtl .serif {
      font-family: 'Noto Nastaliq Urdu', Georgia, serif;
    }

    body.rtl input,
    body.rtl select,
    body.rtl textarea {
      font-family: 'Noto Nastaliq Urdu', system-ui, sans-serif;
    }

    .serif {
      font-family: Georgia, 'Iowan Old Style', serif;
    }

    input,
    select,
    textarea,
    button {
      font-family: inherit;
    }

    input,
    select,
    textarea {
      border: 1px solid #DDD5BE;
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 14px;
      background: #FCFAF5;
      color: var(--ink);
      outline: none;
      width: 100%;
    }

    input[type="file"] {
      padding: 7px 8px;
      font-size: 12.5px;
    }

    textarea {
      resize: vertical;
      min-height: 70px;
    }

    label.field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 13px;
      color: #4B4E40;
    }

    label.field span {
      font-weight: 600;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    button {
      cursor: pointer;
    }

    .btn-primary {
      background: var(--green-mid);
      color: #FBF6E9;
      border: none;
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-secondary {
      background: #fff;
      color: var(--green-mid);
      border: 1px solid var(--green-mid);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-danger-outline {
      border: 1px solid var(--danger-border);
      background: var(--danger-bg);
      color: var(--danger);
      border-radius: 8px;
      padding: 9px 16px;
      font-size: 13.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid #DDD5BE;
      color: #4B4E40;
      border-radius: 7px;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn.danger {
      border-color: var(--danger-border);
      color: var(--danger);
    }

    .pill {
      border: 1px solid #DDD5BE;
      background: #fff;
      color: #4B4E40;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
    }

    .pill.active {
      border-color: var(--green-mid);
      background: var(--green-mid);
      color: #fff;
    }

    .lang-pill {
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      color: #C9D6CC;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      flex: 1;
    }

    .lang-pill.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #1A2E22;
    }

    /* ---------- lock screen ---------- */
    #lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 0%, #1E4636, #0F2A22 70%);
      padding: 20px;
    }

    .lock-card {
      background: #FBF8F1;
      border-radius: 16px 16px 20px 20px;
      padding: 34px 30px;
      width: 340px;
      max-width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .lock-logo {
      width: 96px;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .arch-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      background: linear-gradient(180deg, #2A6E54, #14342A);
    }

    .lock-title {
      font-size: 21px;
      font-weight: 700;
      color: #1A2E22;
    }

    .lock-sub {
      color: var(--muted-light);
      font-size: 13px;
      margin: 2px 0 22px;
    }

    .lock-error {
      color: var(--danger);
      font-size: 12.5px;
      margin: 8px 0;
    }

    .lock-note {
      font-size: 11px;
      color: var(--faint);
      margin-top: 16px;
      line-height: 1.5;
    }

    /* ---------- shell ---------- */
    #shell {
      display: flex;
      min-height: 100vh;
    }

    #sidebar {
      width: 230px;
      flex-shrink: 0;
      background: linear-gradient(180deg, #16382C, #0F291F);
      color: #EAE6D6;
      display: flex;
      flex-direction: column;
      padding: 22px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 6px 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 17px 17px 6px 6px;
      font-size: 16px;
      overflow: hidden;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-weight: 700;
      font-size: 15px;
      line-height: 1.2;
    }

    .brand-sub {
      font-size: 10.5px;
      color: #9FB3A6;
    }

    nav.navlist {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .navlink {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #D9D5C2;
      font-size: 13.5px;
      font-weight: 500;
      text-align: left;
      width: 100%;
    }

    body.rtl .navlink {
      text-align: right;
    }

    .navlink.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold-light);
      font-weight: 700;
    }

    .navlink svg {
      flex-shrink: 0;
    }

    .sidebar-footer {

      font-size: 11px;
      color: #7C9184;
      padding-top: 14px;
    }

    #topbar {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);

      position: sticky;
      top: 0;
      z-index: 40;
    }

    #hamburger {
      border: none;
      background: transparent;
    }

    #main {
      flex: 1;
      min-width: 0;
      padding: 28px 32px;
      max-width: 1100px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 18px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .section-title {
      margin: 0;
      font-size: 24px;
      color: #1A2E22;
    }

    .section-sub {
      color: var(--muted-light);
      font-size: 13.5px;
      margin-top: 3px;
    }

    .stat-card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 4px 4px 12px 12px;
      padding: 18px 20px;
      flex: 1 1 200px;
      min-width: 200px;
    }

    .stat-card.gold {
      border-top: 3px solid var(--gold);
    }

    .stat-card.danger {
      border-top: 3px solid var(--danger);
    }

    .stat-card.default {
      border-top: 3px solid var(--green-mid);
    }

    .stat-label {
      font-size: 12px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--ink);
      margin-top: 6px;
    }

    .stat-sub {
      font-size: 12.5px;
      color: var(--muted-light);
      margin-top: 4px;
    }

    .stat-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 26px;

    /* ---------- lightbox ---------- */
    #lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 15, 0.88);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
      animation: lightbox-fade .15s ease-out;
    }

    @keyframes lightbox-fade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    #lightbox-overlay .lightbox-inner {
      cursor: default;
      max-width: 95vw;
      max-height: 95vh;
      position: relative;
    }

    #lightbox-overlay .lightbox-close {
      position: absolute;
      top: -14px;
      right: -14px;
      background: #FBF6E9;
      color: #1A2E22;
      border: none;
      border-radius: 999px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    @media print {

      #sidebar,
      #topbar,
      .form-card,
      .section-header button,
      #main>form {
        display: none !important;
      }

      body {
        background: #fff;
      }

      #main {
        padding: 0;
        max-width: none;

    function escapeHtml(str) {
      return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function safeUrl(url) {
      const u = String(url || "").trim();

      return "";

    /* ---------- lightbox (click to enlarge photos/videos) ---------- */
    function closeLightbox() {
      const el = document.getElementById("lightbox-overlay");
      if (el) el.remove();
    }
    function openLightbox(innerHtml) {
      closeLightbox();
      const overlay = document.createElement("div");
      overlay.id = "lightbox-overlay";
      overlay.innerHTML = `<div class="lightbox-inner">${innerHtml}<button class="lightbox-close" aria-label="Close">${ICONS.close}</button></div>`;
      overlay.addEventListener("click", (e) => { if (e.target === overlay) closeLightbox(); });
      overlay.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
      document.addEventListener("keydown", escCloseOnce);
      document.body.appendChild(overlay);
    }
    function escCloseOnce(e) {
      if (e.key === "Escape") { closeLightbox(); document.removeEventListener("keydown", escCloseOnce); }
    }
    function openImageLightbox(url) {
      const u = safeUrl(url);
      if (!u) return;
      openLightbox(`<img src="${u}" style="max-width:95vw;max-height:95vh;object-fit:contain;border-radius:8px;display:block;" />`);
    }
    function openEmbedVideoLightbox(embedUrl, title) {
      const u = safeUrl(embedUrl) || embedUrl;
      openLightbox(`<div style="width:90vw;max-width:960px;aspect-ratio:16/9;"><iframe src="${u}" title="${escapeHtml(title || 'video')}" style="width:100%;height:100%;border:none;border-radius:8px;" allowfullscreen></iframe></div>`);
    }
    function openUploadedVideoLightbox(url) {
      const u = safeUrl(url);
      if (!u) return;
      openLightbox(`<video src="${u}" controls autoplay style="max-width:95vw;max-height:95vh;border-radius:8px;"></video>`);
    }
    /* Delegated so it keeps working across re-renders without rebinding */
    function handleGlobalLightboxClick(e) {
      const imgEl = e.target.closest("[data-lightbox-img]");
      if (imgEl) { openImageLightbox(imgEl.getAttribute("data-lightbox-img")); return; }
      const vidEl = e.target.closest("[data-lightbox-video]");
      if (vidEl) {
        const url = vidEl.getAttribute("data-lightbox-video");
        if (vidEl.getAttribute("data-video-type") === "embed") openEmbedVideoLightbox(url, vidEl.getAttribute("data-video-title"));
        else openUploadedVideoLightbox(url);
      }
    }

    /* ---------- local-only storage (device preferences, lock rate-limit) ---------- */
    const store = {
      get(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (raw == null) return fallback;
          return JSON.parse(raw);
        } catch (e) { return fallback; }
      },
      set(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); return true; }
        catch (e) { console.error("Storage save failed", key, e); return false; }
      }
    };

    const db = firebase.firestore();

    async function loadCloudState() {
      const snap = await CLOUD_DOC.get();
      return snap.exists ? snap.data() : {};
    }

    function saveCloudField(field, value) {
      CLOUD_DOC.set({ [field]: value }, { merge: true }).catch(err => {
        console.error("Cloud save failed:", field, err);
        alert(t("storage_full_warning"));
      });
    }

    /* ---------- passcode hashing (SHA-256, one-way, local only) ---------- */
    async function hashPasscode(pass) {
      const enc = new TextEncoder().encode(String(pass));
      const buf = await crypto.subtle.digest("SHA-256", enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    const LOCK_DURATION_MS = 30000;

    function initFloatingTools() {
      if (document.getElementById("floating-tools-btn")) return; // already mounted, don't duplicate

      const btn = document.createElement("button");
      btn.id = "floating-tools-btn";
      btn.setAttribute("aria-label", "Tools");
      btn.innerHTML = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="16" y2="14"/><line x1="8" y1="18" x2="10" y2="18"/><line x1="14" y1="18" x2="16" y2="18"/></svg>';
      document.body.appendChild(btn);

      const panel = document.createElement("div");
      panel.id = "floating-tools-panel";
      document.body.appendChild(panel);
      // Stops any click inside the panel — including switching tabs, which
      // replaces the panel's inner content — from being mistaken for a
      // click "outside" the panel by the listener below.
      panel.addEventListener("click", (e) => e.stopPropagation());

      const saved = ftPosition();
      if (saved && saved.x != null && saved.y != null) {
        btn.style.left = saved.x + "px";
        btn.style.top = saved.y + "px";
      } else {
        btn.style.right = "20px";
        btn.style.bottom = "84px";
      }

      let dragging = false, moved = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;

      function pointerDown(e) {
        const p = e.touches ? e.touches[0] : e;
        dragging = true; moved = false;
        const rect = btn.getBoundingClientRect();
        startX = p.clientX; startY = p.clientY;
        startLeft = rect.left; startTop = rect.top;
        btn.style.right = "auto"; btn.style.bottom = "auto";
        btn.style.left = rect.left + "px"; btn.style.top = rect.top + "px";
        e.preventDefault();
      }
      function pointerMove(e) {
        if (!dragging) return;
        const p = e.touches ? e.touches[0] : e;
        const dx = p.clientX - startX, dy = p.clientY - startY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        let newLeft = startLeft + dx, newTop = startTop + dy;
        newLeft = Math.max(4, Math.min(window.innerWidth - btn.offsetWidth - 4, newLeft));
        newTop = Math.max(4, Math.min(window.innerHeight - btn.offsetHeight - 4, newTop));
        btn.style.left = newLeft + "px";
        btn.style.top = newTop + "px";
        if (FT.open) positionPanel();
      }
      function pointerUp() {
        if (!dragging) return;
        dragging = false;
        if (moved) {
          const rect = btn.getBoundingClientRect();
          ftSavePosition({ x: rect.left, y: rect.top });
        } else {
          toggleFtPanel();
        }
      }

      btn.addEventListener("mousedown", pointerDown);
      window.addEventListener("mousemove", pointerMove);
      window.addEventListener("mouseup", pointerUp);
      btn.addEventListener("touchstart", pointerDown, { passive: false });
      window.addEventListener("touchmove", pointerMove, { passive: false });
      window.addEventListener("touchend", pointerUp);
      window.addEventListener("resize", () => { if (FT.open) positionPanel(); });

      function positionPanel() {
        const rect = btn.getBoundingClientRect();
        const panelWidth = Math.min(300, window.innerWidth - 24);
        let left = rect.left + rect.width / 2 - panelWidth / 2;
        left = Math.max(12, Math.min(window.innerWidth - panelWidth - 12, left));
        const panelHeightGuess = 340;
        if (rect.top - panelHeightGuess > 8) {
          panel.style.top = "";
          panel.style.bottom = (window.innerHeight - rect.top + 10) + "px";
        } else {
          panel.style.bottom = "";
          panel.style.top = (rect.bottom + 10) + "px";
        }
        panel.style.left = left + "px";
        panel.style.width = panelWidth + "px";
      }

      function toggleFtPanel() {
        FT.open = !FT.open;
        if (FT.open) {
          positionPanel();
          renderFtPanel();
          panel.classList.add("open");
        } else {
          panel.classList.remove("open");
        }
      }

      document.addEventListener("click", (e) => {
        if (!FT.open) return;
        if (panel.contains(e.target) || btn.contains(e.target)) return;
        FT.open = false;
        panel.classList.remove("open");
      });
    }

    function ftCalcEvaluate(expr) {
      if (!/^[0-9+\-*/().\s]+$/.test(expr)) throw new Error("invalid");
      const result = Function('"use strict"; return (' + expr + ")")();
      if (typeof result !== "number" || !isFinite(result)) throw new Error("invalid");
      return result;
    }
    function bindFtCalc() {
      document.querySelectorAll("[data-ft-key]").forEach(btn => {
        btn.addEventListener("click", () => {
          const isUr = typeof state !== "undefined" && state.lang === "ur";
          const errorText = isUr ? "غلطی" : "Error";
          const key = btn.getAttribute("data-ft-key");
          if (key === "C") { FT.calcExpr = ""; }
          else if (key === "back") { FT.calcExpr = FT.calcExpr.slice(0, -1); }
          else if (key === "=") {
            try { FT.calcExpr = String(ftCalcEvaluate(FT.calcExpr || "0")); }
            catch (e) { FT.calcExpr = errorText; }
          } else {
            if (FT.calcExpr === errorText) FT.calcExpr = "";
            FT.calcExpr += key;
          }
          const disp = document.getElementById("ft-calc-display");
          if (disp) disp.textContent = FT.calcExpr || "0";
        });
      });
    }

      const isUr = typeof state !== "undefined" && state.lang === "ur";
      const now = new Date();
      const dayNamesShort = isUr ? ["اتوار", "پیر", "منگل", "بدھ", "جمعرات", "جمعہ", "ہفتہ"] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

        : ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const big = now.getDate() + " " + monthNamesFull[now.getMonth()] + " " + now.getFullYear();
      const sub = dayNamesShort[now.getDay()] + " \u00b7 " + now.toLocaleTimeString(isUr ? "ur" : "en-GB", { hour: "2-digit", minute: "2-digit" });

      const year = now.getFullYear(), month = now.getMonth();
      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let cells = "";
      for (let i = 0; i < firstDow; i++) cells += '<div class="ft-day"></div>';
      for (let d = 1; d <= daysInMonth; d++) {
        cells += '<div class="ft-day ' + (d === now.getDate() ? "ft-today" : "") + '">' + d + "</div>";
      }

      return `
    <div class="ft-date-big">${big}</div>
    <div class="ft-date-sub">${sub}</div>

      async function downloadYearlyPrayerPdf(year) {
        if (!window.jspdf || !window.jspdf.jsPDF) {
          throw new Error(
            "jsPDF didn't load. Check that both <script> tags for jspdf and " +
            "jspdf-autotable are in <head>, in that order, and that your browser " +
            "isn't blocking the CDN (check the DevTools Console/Network tab for a 404 or CSP error)."
          );
        }

        year = year || state.prayerYear || new Date().getFullYear();
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "pt", format: "a4" });

        if (typeof doc.autoTable !== "function") {
          throw new Error(
            "jspdf-autotable didn't load (doc.autoTable is missing). Make sure its " +
            "<script> tag is AFTER the jspdf <script> tag in <head>."
          );
        }

        const pageWidth = doc.internal.pageSize.getWidth();
        const marginX = 40;

        let logoDataUrl = null;
        if (state.logo) logoDataUrl = await urlToDataUrl(state.logo);

        const HEAD = ["Date", "Day", "Fajr", "Sunrise", "Dhuhr", "Asr", "Maghrib", "Isha", "Jumu'ah"];

        for (let m = 0; m < 12; m++) {
          if (m > 0) doc.addPage();
          let y = 50;

          if (logoDataUrl) {
            try { doc.addImage(logoDataUrl, "PNG", marginX, y - 28, 36, 36); } catch (e) { console.warn("addImage failed:", e); }
          }

          doc.setFont("helvetica", "bold");
          doc.setFontSize(18);
          doc.text("Mahmood Masjid", pageWidth / 2, y, { align: "center" });
          y += 20;

          doc.setFont("helvetica", "normal");
          doc.setFontSize(12);
          doc.text("Prayer Times \u2014 " + MONTHS_EN[m] + " " + year + " \u00b7 Hanafi", pageWidth / 2, y, { align: "center" });
          y += 18;

          const daysInMonth = new Date(year, m + 1, 0).getDate();
          const base = (state.prayer && state.prayer.monthly && state.prayer.monthly[m]) || emptyMonthlyTimes();
          const overrides = (state.prayer && state.prayer.overrides) || [];
          const rows = [];

          for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, m, d);
            const iso = dateObj.toISOString().slice(0, 10);
            const isFriday = dateObj.getDay() === 5;
            const override = overrides.find(o => o.date === iso);
            let times = { ...base, ...(override || {}) };
            if (typeof getDailyPrayerTimes === "function") times = getDailyPrayerTimes(dateObj, times);

            rows.push([
              String(d),
              DAY_NAMES_EN[dateObj.getDay()],
              times.fajr || "\u2014",
              times.sunrise || "\u2014",
              isFriday ? "\u2014" : (times.dhuhr || "\u2014"),
              times.asr || "\u2014",
              times.maghrib || "\u2014",
              times.isha || "\u2014",
              isFriday ? (times.jumma || "\u2014") : "\u2014",
            ]);
          }

          doc.autoTable({
            startY: y,
            head: [HEAD],
            body: rows,
            styles: { fontSize: 9, cellPadding: 4, halign: "center" },
            headStyles: { fillColor: [22, 56, 44], textColor: [244, 217, 138] },
            alternateRowStyles: { fillColor: [250, 246, 236] },
            columnStyles: { 0: { fontStyle: "bold" }, 1: { halign: "left" } },
            margin: { left: marginX, right: marginX },
          });
        }

        doc.save("Mahmood-Masjid-Prayer-Times-" + year + ".pdf");
      }

        doc.setTextColor(0, 0, 0);
        y += 22;

        // Keeps the same order shown in the Donations tab (file order, not re-sorted).
        const rows = state.donations.map((d, i) => [
          String(i + 1),
          d.name || "",
          d.city || "\u2014",
          d.date || "\u2014",
          currency(d.amount),
        ]);

        doc.autoTable({
          startY: y,

            4: { halign: "right", fontStyle: "bold", cellWidth: 90 },

          margin: { left: marginX, right: marginX },
          // Repeats "Mahmood Masjid" as a running footer on every page, since
          // the donor list can run to many pages for a large mosque.

            const h = doc.internal.pageSize.getHeight();

            doc.setTextColor(150, 150, 150);

            doc.text("Page " + doc.internal.getNumberOfPages(), pageWidth - marginX, h - 20, { align: "right" });
            doc.setTextColor(0, 0, 0);
          },
        });

        doc.save("Mahmood-Masjid-Donors.pdf");
      }

    /* ================= LOCK SCREEN ================= */
    function renderLock() {
      const hasPasscode = !!state.passcodeHash;
      const lockInfo = getLockInfo();
      const now = Date.now();
      const isLocked = lockInfo.lockUntil && lockInfo.lockUntil > now;
      app.innerHTML = `
    <div id="lock-screen">
      <div class="lock-card">
        <div style="display:flex;justify-content:center;margin-bottom:14px;">
          <img class="lock-logo" src="/assets/img/AdminLogo.png" alt="Mahmood Masjid logo" />
        </div>
        <div class="lock-title serif">Mahmood Masjid</div>
        <div class="lock-sub">${t("lock_sub")}</div>
        <form id="lock-form">
          ${!hasPasscode ? `
            <div style="font-size:13px;color:#4B4E40;margin-bottom:14px;line-height:1.5;">
              ${t("lock_first_time")}
            </div>
            <input type="password" id="lock-val" placeholder="${t('ph_create_passcode')}" style="margin-bottom:10px;text-align:center;" autofocus />
            <input type="password" id="lock-confirm" placeholder="${t('ph_confirm_passcode')}" style="margin-bottom:10px;text-align:center;" />
          ` : `
            <input type="password" id="lock-val" placeholder="${t('ph_enter_passcode')}" style="margin-bottom:10px;text-align:center;" autofocus ${isLocked ? "disabled" : ""} />
          `}
          <div class="lock-error" id="lock-error"></div>
          <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:6px;" ${isLocked ? "disabled" : ""}>
            ${hasPasscode ? t("btn_unlock") : t("btn_save_continue")}
          </button>
        </form>
        <div style="display:flex;gap:6px;margin-top:16px;">
          <button type="button" class="pill ${state.lang === 'en' ? 'active' : ''}" data-lang="en" style="flex:1;">EN</button>
          <button type="button" class="pill ${state.lang === 'ur' ? 'active' : ''}" data-lang="ur" style="flex:1;">اردو</button>
        </div>
        <div class="lock-note">${t("lock_note")}</div>
      </div>
    </div>
  `;
      let lockCountdownInterval = null;
      if (isLocked) {
        const errorEl = document.getElementById("lock-error");
        const tick = () => {
          const remaining = Math.max(0, Math.ceil((lockInfo.lockUntil - Date.now()) / 1000));
          errorEl.textContent = t("err_locked", { s: remaining });
          if (remaining <= 0) { clearInterval(lockCountdownInterval); renderLock(); }
        };
        tick();
        lockCountdownInterval = setInterval(tick, 1000);
      }
      document.getElementById("lock-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const currentLockInfo = getLockInfo();
        if (currentLockInfo.lockUntil && currentLockInfo.lockUntil > Date.now()) return;
        const val = document.getElementById("lock-val").value;
        const errorEl = document.getElementById("lock-error");
        if (!hasPasscode) {
          const confirmVal = document.getElementById("lock-confirm").value;
          if (val.length < 4) { errorEl.textContent = t("err_min_chars"); return; }
          if (val !== confirmVal) { errorEl.textContent = t("err_mismatch"); return; }
          const h = await hashPasscode(val);
          state.passcodeHash = h;
          saveCloudField("passcodeHash", h);
          setLockInfo({ attempts: 0, lockUntil: 0 });
          state.unlocked = true;
          render();
        } else {
          const h = await hashPasscode(val);
          if (h === state.passcodeHash) {
            setLockInfo({ attempts: 0, lockUntil: 0 });
            state.unlocked = true;
            render();
          } else {
            const info = getLockInfo();
            const attempts = (info.attempts || 0) + 1;
            if (attempts >= LOCK_MAX_ATTEMPTS) {
              setLockInfo({ attempts: 0, lockUntil: Date.now() + LOCK_DURATION_MS });
              renderLock();
            } else {
              setLockInfo({ attempts, lockUntil: 0 });
              errorEl.textContent = t("err_incorrect");
            }
          }
        }
      });
      document.querySelectorAll("[data-lang]").forEach(btn => {
        btn.addEventListener("click", () => setLang(btn.getAttribute("data-lang")));
      });
      if (!isLocked) document.getElementById("lock-val").focus();
    }

      }).format(now);

        timeZone, weekday: "short", day: "numeric", month: "short", year: "numeric"
      }).format(now);
      return { time, date };

    /* ================= VIDEOS ================= */
    function isDirectVideoUrl(url) {
      return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(String(url || "").trim());
    }
    function toEmbedUrl(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) return "https://www.youtube.com/embed/" + u.pathname.slice(1);
        if (u.hostname.includes("youtube.com")) {
          const id = u.searchParams.get("v");
          if (id) return "https://www.youtube.com/embed/" + id;
          if (u.pathname.startsWith("/embed/")) return url;
        }
      } catch (e) { /* not a valid URL */ }
      return url;
    }

          alert(t("storage_full_warning"));
          return;
        }
        renderMain();
      });
      document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => { state.infraFilter = btn.getAttribute("data-filter"); renderMain(); });
      });
      document.querySelectorAll("[data-del]").forEach(btn => {
        btn.addEventListener("click", () => {
          confirmDelete("confirm_delete_infra", () => {
            state.infra = state.infra.filter(i => i.id !== btn.getAttribute("data-del"));
            persist("infra");
            renderMain();
          });
        });
      });
    }

    /* ================= PRAYER TIMES ================= */
    function viewPrayer() {
      const modeButtons = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="pill ${state.prayerMode === 'calendar' ? 'active' : ''}" data-mode="calendar">${t('mode_calendar')}</button>
      <button class="pill ${state.prayerMode === 'edit' ? 'active' : ''}" data-mode="edit">${t('mode_edit')}</button>
${state.prayerMode === 'calendar' ? `
  <button class="btn-secondary" id="prayer-print-month">${ICONS.download} ${state.lang === 'ur' ? 'اس مہینے کی پی ڈی ایف' : 'Download This Month'}</button>
  <button class="btn-secondary" id="prayer-print-year">${ICONS.download} ${state.lang === 'ur' ? 'پورا سال پی ڈی ایف' : 'Download Full Year'}</button>
` : ""}    </div>
  `;
      let body;
      if (state.prayerMode === "edit") {
        body = `
      <div style="font-size:13px;color:var(--muted-light);margin-bottom:14px;">
        ${t('edit_intro')}
      </div>
      <div class="prayer-months-grid">
        ${MONTHS_EN.map((_, idx) => {
          const t3 = state.prayer.monthly[idx] || emptyMonthlyTimes();
          return `
            <div class="prayer-month-card">
              <div style="font-weight:700;margin-bottom:10px;">${monthName(idx)}</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                ${TIME_FIELDS.map(f => `
                  <label class="field"><span>${t(f.labelKey)}</span><input type="time" data-month="${idx}" data-field="${f.key}" value="${t3[f.key] || ""}" /></label>
                `).join("")}
                <label class="field"><span>${t('lbl_jumma')}</span><input type="time" data-month="${idx}" data-field="jumma" value="${t3.jumma || ""}" /></label>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    `;
      } else {
        const year = state.prayerYear, monthIdx = state.prayerMonthIdx;
        const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
        const base = state.prayer.monthly[monthIdx] || emptyMonthlyTimes();
        const overrides = state.prayer.overrides || [];
        const today = todayISO();
        const rows = Array.from({ length: daysInMonth }, (_, i) => {
          const dayNum = i + 1;
          const dateObj = new Date(year, monthIdx, dayNum);
          const iso = dateObj.toISOString().slice(0, 10);
          const isFriday = dateObj.getDay() === 5;
          const override = overrides.find(o => o.date === iso);
          const times = getDailyPrayerTimes(dateObj, { ...base, ...(override || {}) });
          return { dayNum, iso, isFriday, weekday: dayName(dateObj.getDay()), times, isToday: iso === today };
        });
        body = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;">
        <button class="cal-nav-btn" id="prev-month">${ICONS.chevLeft}</button>
        <div style="font-weight:700;font-size:16px;min-width:160px;text-align:center;">${monthName(monthIdx)} ${year}</div>
        <button class="cal-nav-btn" id="next-month">${ICONS.chevRight}</button>
        <input type="number" id="cal-year" value="${year}" style="width:90px;margin-inline-start:8px;" />
      </div>
      <div class="table-wrap">
        <div class="cal-table-head">
          <span>${t('col_date')}</span><span>${t('col_day')}</span><span>${t('lbl_fajr')}</span><span>${t('lbl_sunrise')}</span><span>${t('lbl_dhuhr')}</span><span>${t('lbl_asr')}</span><span>${t('lbl_maghrib')}</span><span>${t('lbl_isha')}</span>
        </div>
        <div class="cal-scroll">
          ${rows.map(r => `
            <div class="cal-table-row" style="background:${r.isToday ? '#F3F8F1' : (r.isFriday ? '#FBF6EC' : 'transparent')};">
              <span style="font-weight:600;">${r.dayNum}</span>
              <span style="color:${r.isFriday ? 'var(--gold)' : 'var(--muted)'};font-weight:${r.isFriday ? 700 : 400};">${r.weekday}</span>
              <span>${r.times.fajr || "—"}</span>
              <span>${r.times.sunrise || "—"}</span>
              <span>${r.isFriday ? (r.times.jumma ? `${t('lbl_jumma')} ${r.times.jumma}` : (r.times.dhuhr || "—")) : (r.times.dhuhr || "—")}</span>
              <span>${r.times.asr || "—"}</span>
              <span>${r.times.maghrib || "—"}</span>
              <span>${r.times.isha || "—"}</span>
            </div>
          `).join("")}
        </div>
      </div>
    `;
      }
      return `${sectionHeader(t("prayer_title"), t("prayer_sub"), modeButtons)}${body}`;
    }
    function bindPrayer() {
      document.querySelectorAll("[data-mode]").forEach(btn => {
        btn.addEventListener("click", () => { state.prayerMode = btn.getAttribute("data-mode"); renderMain(); });
      });
      if (state.prayerMode === "edit") {
        document.querySelectorAll("[data-month]").forEach(input => {
          input.addEventListener("change", () => {
            const m = Number(input.getAttribute("data-month"));
            const field = input.getAttribute("data-field");
            state.prayer.monthly[m] = { ...(state.prayer.monthly[m] || emptyMonthlyTimes()), [field]: input.value };
            persist("prayer");
          });
        });
      } else {
        document.getElementById("prev-month").addEventListener("click", () => {
          state.prayerMonthIdx = state.prayerMonthIdx === 0 ? 11 : state.prayerMonthIdx - 1;
          if (state.prayerMonthIdx === 11) state.prayerYear -= 1;
          renderMain();
        });
        document.getElementById("next-month").addEventListener("click", () => {
          state.prayerMonthIdx = state.prayerMonthIdx === 11 ? 0 : state.prayerMonthIdx + 1;
          if (state.prayerMonthIdx === 0) state.prayerYear += 1;
          renderMain();
        });
        document.getElementById("cal-year").addEventListener("change", (e) => {
          state.prayerYear = Number(e.target.value) || state.prayerYear;
          renderMain();
        });

        async function downloadDonorsPdf() {
          ensurePdfLibsLoaded();
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF({ unit: "pt", format: "a4" });
          if (typeof doc.autoTable !== "function") {
            throw new Error("jspdf-autotable didn't load (doc.autoTable is missing). Make sure its <script> tag is AFTER the jspdf <script> tag in <head>.");
          }

          const pageWidth = doc.internal.pageSize.getWidth();
          const marginX = 40;
          let y = 50;

          let logoDataUrl = null;
          if (state.logo) logoDataUrl = await urlToDataUrl(state.logo);
          if (logoDataUrl) {
            try { doc.addImage(logoDataUrl, "PNG", marginX, y - 28, 36, 36); } catch (e) { console.warn("addImage failed:", e); }
          }

          doc.setFont("helvetica", "bold");
          doc.setFontSize(18);
          doc.text("Mahmood Masjid", pageWidth / 2, y, { align: "center" });
          y += 20;

          doc.setFont("helvetica", "normal");
          doc.setFontSize(12);
          const totalDonated = state.donations.reduce((s, d) => s + (Number(d.amount) || 0), 0);
          doc.text(
            "Donor List \u2014 " + state.donations.length + " donation(s) \u00b7 Total " + currency(totalDonated),
            pageWidth / 2, y, { align: "center" }
          );
          y += 10;
          doc.setFontSize(9);
          doc.setTextColor(130, 130, 130);
          doc.text("Generated " + new Date().toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }), pageWidth / 2, y + 10, { align: "center" });
          doc.setTextColor(0, 0, 0);
          y += 22;

          // Keeps the same order shown in the Donations tab (file order, not re-sorted).
          const rows = state.donations.map((d, i) => [
            String(i + 1),
            d.name || "",
            d.city || "\u2014",
            d.date || "\u2014",
            currency(d.amount),
          ]);

          doc.autoTable({
            startY: y,
            head: [["#", "Name", "City", "Date", "Amount"]],
            body: rows,
            styles: { fontSize: 9, cellPadding: 4 },
            headStyles: { fillColor: [22, 56, 44], textColor: [244, 217, 138] },
            alternateRowStyles: { fillColor: [250, 246, 236] },
            columnStyles: {
              0: { halign: "center", cellWidth: 30 },
              1: { halign: "left" },
              2: { halign: "left" },
              3: { halign: "center", cellWidth: 75 },
              4: { halign: "right", fontStyle: "bold", cellWidth: 90 },
            },
            margin: { left: marginX, right: marginX },
            // Repeats "Mahmood Masjid" as a running footer on every page, since
            // the donor list can run to many pages for a large mosque.
            didDrawPage: (data) => {
              const h = doc.internal.pageSize.getHeight();
              doc.setFontSize(8);
              doc.setTextColor(150, 150, 150);
              doc.text("Mahmood Masjid \u00b7 Donor List", marginX, h - 20);
              doc.text("Page " + doc.internal.getNumberOfPages(), pageWidth - marginX, h - 20, { align: "right" });
              doc.setTextColor(0, 0, 0);
            },
          });

          doc.save("Mahmood-Masjid-Donors.pdf");
        }

      }
    }

    /* ================= SETTINGS ================= */
    function viewSettings() {
      return `
    ${sectionHeader(t("settings_title"), t("settings_sub"))}
    <div class="settings-card">
      <h3>${ICONS.image} ${t('card_logo_title')}</h3>
      <div style="font-size:12.5px;color:var(--muted-light);margin-bottom:10px;">${t('logo_hint')}</div>
      ${state.logo ? `<img class="logo-preview" src="${state.logo}" />` : ""}
      <form id="logo-form" style="display:grid;gap:10px;">
        <label class="field"><span>${t('field_image_url')}</span><input type="url" id="logo-url" placeholder="https://..." value="${state.logo ? escapeHtml(state.logo) : ''}" required /></label>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button type="submit" class="btn-primary">${t('btn_save_logo')}</button>
          ${state.logo ? `<button type="button" id="logo-remove" class="btn-danger-outline">${t('btn_remove_logo')}</button>` : ""}
        </div>
      </form>
    </div>
    <div class="settings-card">
      <h3>${ICONS.key} ${t('card_passcode_title')}</h3>
      <form id="passcode-form" style="display:grid;gap:10px;">
        <label class="field"><span>${t('field_current_passcode')}</span><input type="password" id="s-old" /></label>
        <label class="field"><span>${t('field_new_passcode')}</span><input type="password" id="s-new" /></label>
        <button type="submit" class="btn-primary" style="justify-content:center;">${t('btn_update_passcode')}</button>
        <div id="s-msg" style="font-size:12.5px;"></div>
      </form>
    </div>
    <div class="settings-card">
      <h3 style="color:var(--danger);">${ICONS.shield} ${t('card_reset_title')}</h3>
      <div style="font-size:13px;color:var(--muted);margin-bottom:12px;">
        ${t('reset_warning')}
      </div>
      <button id="reset-all" class="btn-danger-outline">${ICONS.reset} ${t('btn_reset_everything')}</button>
    </div>
    <div style="font-size:11.5px;color:var(--faint);max-width:420px;">
      ${t('storage_note')}
    </div>
  `;
    }
    function bindSettings() {
      document.getElementById("logo-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const url = document.getElementById("logo-url").value.trim();
        if (!url) return;
        state.logo = url;
        saveCloudField("logo", url);
        renderShell();
      });
      const removeBtn = document.getElementById("logo-remove");
      if (removeBtn) removeBtn.addEventListener("click", () => {
        state.logo = null;
        saveCloudField("logo", null);
        renderShell();
      });
      document.getElementById("passcode-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const oldP = document.getElementById("s-old").value;
        const newP = document.getElementById("s-new").value;
        const msg = document.getElementById("s-msg");
        const oldHash = await hashPasscode(oldP);
        if (oldHash !== state.passcodeHash) { msg.style.color = "var(--danger)"; msg.textContent = t("msg_current_incorrect"); return; }
        if (!newP || newP.length < 4) { msg.style.color = "var(--danger)"; msg.textContent = t("msg_new_min"); return; }
        const newHash = await hashPasscode(newP);
        state.passcodeHash = newHash;
        saveCloudField("passcodeHash", newHash);
        msg.style.color = "var(--green-mid)";
        msg.textContent = t("msg_updated");
        document.getElementById("s-old").value = "";
        document.getElementById("s-new").value = "";
      });
      document.getElementById("reset-all").addEventListener("click", () => {
        if (!window.confirm(t("confirm_reset"))) return;
        state.donations = []; state.expenses = []; state.photos = []; state.videos = []; state.infra = []; state.layout = [];
        state.prayer = { monthly: Array.from({ length: 12 }, emptyMonthlyTimes), overrides: [] };
        persist("donations"); persist("expenses"); persist("photos"); persist("videos"); persist("infra"); persist("layout"); persist("prayer");
        renderMain();
      });
    }

    /* ---------- boot ---------- */
    async function boot() {
      app.innerHTML = `
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(circle at 50% 0%, #1E4636, #0F2A22 70%);color:#F4D98A;font-size:14px;">
      Loading…
    </div>`;
      // Sign in anonymously so Firestore/Storage security rules can require
      // request.auth != null — this keeps the database from being wide open
      // to anyone who happens to see your Firebase config, while still
      // letting everyone share one simple passcode inside the app itself.
      try {
        await auth.signInAnonymously();
      } catch (err) {
        console.error("Could not sign in to Firebase", err);
        app.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
        background:#2a1414;color:#F4D98A;font-size:14px;padding:24px;text-align:center;">
        Could not connect to Firebase Authentication. Make sure "Anonymous"
        sign-in is enabled for this project (Firebase console → Authentication
        → Sign-in method), then reload.
      </div>`;
        return;
      }
      let cloud;
      try {
        cloud = await loadCloudState();
      } catch (err) {
        console.error("Could not reach Firebase", err);
        app.innerHTML = `
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;
        background:#2a1414;color:#F4D98A;font-size:14px;padding:24px;text-align:center;">
        Could not connect to the cloud database. Check your internet connection and the
        Firebase config at the top of this page, then reload.
      </div>`;
        return;
      }
      state.passcodeHash = cloud.passcodeHash ?? null;
      state.logo = cloud.logo ?? null;
      state.donations = cloud.donations ?? SEED_DONATIONS;
      state.expenses = cloud.expenses ?? SEED_EXPENSES;
      state.photos = cloud.photos ?? [];
      state.videos = cloud.videos ?? [];
      state.infra = cloud.infra ?? [];
      state.layout = cloud.layout ?? [];
      state.prayer = cloud.prayer ?? { monthly: Array.from({ length: 12 }, emptyMonthlyTimes), overrides: [] };
      // First-ever run: seed the shared document with the starter data so
      // every device starts from the same donations/expenses list.
      if (!("donations" in cloud)) saveCloudField("donations", state.donations);
      if (!("expenses" in cloud)) saveCloudField("expenses", state.expenses);
      render();
      listenForCloudUpdates();
    }

    /* Keeps every open device in sync: when someone else adds a donation,
       photo, video, etc. this tab picks it up automatically. Skips
       re-rendering while the person is actively typing in a form. */
    function listenForCloudUpdates() {
      CLOUD_DOC.onSnapshot(snap => {
        if (!snap.exists) return;
        const data = snap.data();
        const active = document.activeElement;
        const isTyping = active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName);
        let changed = false;
        CLOUD_FIELDS.forEach(f => {
          if (f in data && JSON.stringify(data[f]) !== JSON.stringify(state[f])) {
            state[f] = data[f];
            changed = true;
          }
        });
        if (changed && state.unlocked && !isTyping) renderMain();
      }, err => console.error("Cloud sync error:", err));
    }

    boot();
  </script>
