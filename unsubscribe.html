<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsubscribe - Mahmood Masjid</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background: linear-gradient(135deg,
                    #052a27,
                    #0c6b3f);
        }

        .card {
            width: 90%;
            max-width: 500px;

            padding: 40px;

            text-align: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, .12);

            border: 1px solid rgba(255, 255, 255, .18);

            backdrop-filter: blur(10px);

            color: white;
        }

        .logo {
            width: 140px;
            margin-bottom: 20px;
        }

        button {
            background: #f4eec9;
            color: #06342f;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: white;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">

        <img src="https://www.mahmoodmasjid.com/assets/img/logo.png" class="logo" alt="Mahmood Masjid">

        <h1>Unsubscribe</h1>

        <p>
            Click the button below to stop receiving
            email updates from Mahmood Masjid.
        </p>

        <button id="unsubscribeButton">
            Unsubscribe Me
        </button>

        <div id="message"></div>

    </div>

    <script>

        const email =
            new URLSearchParams(
                window.location.search
            ).get("email");

        document
            .getElementById("unsubscribeButton")
            .addEventListener("click", async () => {

                if (!email) {

                    document.getElementById("message")
                        .innerHTML =
                        "❌ Invalid unsubscribe link.";

                    return;
                }

                try {

                    await fetch(
                        "YOUR_UNSUBSCRIBE_SCRIPT_URL",
                        {
                            method: "POST",
                            body: JSON.stringify({
                                email: email
                            })
                        });

                    document.getElementById("message")
                        .innerHTML =
                        "✅ You have been unsubscribed.";

                }
                catch {

                    document.getElementById("message")
                        .innerHTML =
                        "❌ Something went wrong.";

                }

            });

    </script>

</body>

</html>
