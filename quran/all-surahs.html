<style>
    .page-hero__main h1 {
        white-space: normal;
        font-size: clamp(1.8rem, 4vw, 2.8rem);
    }

    .page-hero__main .breadcrumb {
        justify-content: center;
    }

    .list-wrap {
        margin-top: 1.25rem;
        padding: 1.35rem;
    }

    .surah-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 1rem;
        margin-top: 1rem;
    }

    .surah {
        text-decoration: none;
        color: inherit;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: .3rem;
        min-height: 7.5rem;
        padding: 1rem;
        text-align: center;
        border-radius: 20px;
        border: 1px solid rgba(224, 230, 221, .12);
        background: rgba(255, 255, 255, .04);
    }

    .surah:hover {
        border-color: rgba(214, 221, 209, .26);
        background: rgba(255, 255, 255, .06);
    }

    .surah .num {
        color: var(--accent);
        font-size: .78rem;
        letter-spacing: .18em;
    }

    .surah .en {
        font-family: "Cormorant Garamond", Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        line-height: 1.1;
    }

    .surah .ar {
        color: var(--muted);
        font-size: 1.15rem;
    }

    .surah.is-hidden {
        display: none;
    }

    .none {
        display: none;
        color: var(--muted);
        text-align: center;
        margin: 1.5rem 0 .5rem;
    }

    /* mobile: simple list */
    @media (max-width: 640px) {
        .list-wrap {
            padding: 1rem;
        }

        .surah-grid {
            display: block;
            margin-top: .5rem;
        }

        .surah {
            flex-direction: row;
            justify-content: flex-start;
            gap: .9rem;
            min-height: 0;
            padding: .85rem .25rem;
            text-align: left;
            border: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            background: none;
        }

        .surah:hover {
            background: none;
        }

        .surah .num {
            min-width: 2rem;
            letter-spacing: 0;
            font-size: .9rem;
        }

        .surah .en {
            flex: 1;
            font-size: 1.3rem;
        }

        .surah .ar {
            font-size: 1.1rem;
        }
    }
</style>
<link rel="stylesheet" href="/assets/css/quran.css">
<body>
    <div class="background-layer background-layer--one"></div>
    <div class="background-layer background-layer--two"></div>

    <main class="shell">
        <header class="page-hero page-hero--home glass-panel">
            <div class="page-hero__main">
                <p class="eyebrow">Quran</p>
                <h1>All Surahs</h1>
                <div class="breadcrumb">
                    <a href="../index.html">Home</a>
                    <span>/</span>
                    <a href="../pages/quran.html">Quran</a>
                    <span>/</span>
                    <span>All Surahs</span>
                </div>
                <div class="search-wrap search-wrap--stacked search-wrap--center" role="search">
                    <label class="sr-only" for="q">Search surahs</label>
                    <input id="q" type="search" placeholder="Search by name or number…" autocomplete="off" />
                    <button class="ghost-button" id="clear" type="button">Clear</button>

        <section class="content-card glass-card list-wrap">

            <div class="surah-grid" id="grid"></div>
            <p class="none" id="none">No surah found.</p>
        </section>
    </main>

    <script>
        const S = `Al-Fatiha|الفاتحة

Al-Fil|الفيل
Quraysh|قريش

Al-Kawthar|الكوثر
Al-Kafirun|الكافرون
An-Nasr|النصر
Al-Masad|المسد
Al-Ikhlas|الإخلاص
Al-Falaq|الفلق
An-Nas|الناس`.split('\n');

        const grid = document.getElementById('grid');
        S.forEach((line, i) => {
            const [en, ar] = line.split('|');
            const d = document.createElement('a');
            d.className = 'surah'; d.href = 'read.html?surah=' + (i + 1);
            d.dataset.search = (i + 1) + ' ' + en.toLowerCase().replace(/[-']/g, '') + ' ' + en.toLowerCase();
            d.innerHTML = `<span class="num">${i + 1}</span><span class="en"></span><span class="ar" lang="ar" dir="rtl"></span>`;
            d.querySelector('.en').textContent = en;
            d.querySelector('.ar').textContent = ar;
            grid.appendChild(d);
        });

        const q = document.getElementById('q');
        function filter() {
            const v = q.value.trim().toLowerCase().replace(/[-']/g, '');
            let shown = 0;
            grid.querySelectorAll('.surah').forEach(el => {
                const hit = !v || el.dataset.search.includes(v);
                el.classList.toggle('is-hidden', !hit);
                if (hit) shown++;
            });
            document.getElementById('none').style.display = shown ? 'none' : 'block';
        }
        q.oninput = filter;
        document.getElementById('clear').onclick = () => { q.value = ''; filter(); q.focus(); };
    </script>
